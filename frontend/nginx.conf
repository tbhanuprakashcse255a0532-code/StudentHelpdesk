server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect the root URL to the existing application route
    location = / {
        return 302 /StudentHelpdesk/;
    }

    # Handle the route without a trailing slash
    location = /StudentHelpdesk {
        return 301 /StudentHelpdesk/;
    }

    # Serve React frontend
    location /StudentHelpdesk/ {
        try_files $uri $uri/ /StudentHelpdesk/index.html;
    }

    # Forward API requests to backend
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward uploaded files to backend
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}