
services:
  db:
    image: mysql:8.0
    container_name: helpdesk-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init/01-s_helpdesk_backup.sql:/docker-entrypoint-initdb.d/01-s_helpdesk_backup.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: helpdesk-backend
    restart: unless-stopped

    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      CLIENT_ORIGIN: http://studenthelpdesk.test

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./Backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: http://studenthelpdesk.test

    container_name: helpdesk-frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:18080:80"

    depends_on:
      - backend

volumes:
  mysql_data:
